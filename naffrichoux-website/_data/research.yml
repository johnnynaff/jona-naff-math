# Research themes — shown on the Research page (expandable cards) and the Home page (list).
# summary: one line, plain text, LaTeX with \( … \).  details: Markdown, LaTeX with $$ … $$ (kramdown syntax).
- id: well-posedness
  title: Well-posedness of parabolic SPDEs and SDEs
  summary: Existence, uniqueness and stability of solutions beyond the Lipschitz setting.
  details: >-
    Proving that a stochastic equation has a unique solution, and that this solution depends
    continuously on the data, is the first question for any model. I study strong and pathwise
    well-posedness for stochastic differential equations and for parabolic stochastic partial
    differential equations such as stochastic heat equations, when the coefficients are too
    irregular for classical fixed-point arguments.
  keywords: [pathwise uniqueness, strong solutions, mild solutions, stochastic heat equation]

- id: regularization
  title: Regularization by noise
  summary: How a rough enough noise restores well-posedness for ill-posed equations.
  details: >-
    An ordinary differential equation $$\dot x = b(x)$$ with a non-Lipschitz drift may have many
    solutions, yet adding noise can select exactly one. This phenomenon — going back to the
    work of Zvonkin and Veretennikov for Brownian noise and extended to fractional noise by
    Catellier and Gubinelli — is a central tool in my work, both for proving uniqueness and
    for quantifying how much regularity the noise provides.
  keywords: [Zvonkin transform, averaging along paths, stochastic sewing]

- id: singular-drifts
  title: Singular drifts
  summary: Drifts that are merely bounded, Hölder, integrable or even distributional.
  details: >-
    Many models of interest involve drifts $$b$$ with very little regularity: bounded measurable
    functions, functions in Hölder or Lebesgue spaces, or genuine distributions. I am interested
    in identifying sharp conditions on $$b$$ under which the equation stays well-posed, and in
    understanding what happens at the threshold.
  keywords: [Hölder and Besov drifts, Krylov–Röckner condition, distributional drifts]

- id: fractional-noise
  title: Fractional noise
  summary: Equations driven by fractional Brownian motion with Hurst index \(H \neq 1/2\).
  details: >-
    Fractional Brownian motion $$B^H$$ is neither a semimartingale nor a Markov process when
    $$H \neq 1/2$$, so Itô calculus and PDE methods are no longer directly available. Its
    regularizing effect nevertheless improves as $$H$$ decreases, which makes it a natural
    driver for regularization-by-noise results and for the numerical analysis of such equations.
  keywords: [fractional Brownian motion, Hurst parameter, Volterra kernels, local nondeterminism]

- id: numerical-analysis
  title: Numerical analysis
  summary: Convergence rates of discretization schemes in low-regularity regimes.
  details: >-
    When coefficients are irregular, standard error analyses of numerical schemes break down.
    I study strong and weak convergence rates of time and space discretizations — the
    Euler–Maruyama scheme, exponential and splitting integrators, finite-difference
    approximations — and how the noise itself can be used to recover good rates.
  keywords: [Euler–Maruyama, strong and weak error, splitting schemes, convergence rates]

- id: long-time
  title: Long-time behaviour
  summary: Invariant measures, ergodicity and their numerical approximation.
  details: >-
    Over long time horizons, many stochastic systems forget their initial condition and settle
    into a statistical equilibrium described by an invariant measure. I am interested in
    ergodicity for equations with irregular coefficients and in how well numerical schemes
    preserve, and approximate, this long-time behaviour.
  keywords: [invariant measures, ergodicity, mixing, approximation of invariant laws]
