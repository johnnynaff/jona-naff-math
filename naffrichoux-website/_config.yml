title: Jonathan Naffrichoux
description: >-
  PhD candidate in mathematics at the Université de Pau et des Pays de l'Adour (LMAP).
  Analysis of stochastic PDEs: well-posedness, numerical analysis, regularization by noise.
lang: en

# If the repository is called <username>.github.io, keep baseurl empty.
# If it is any other name (e.g. "website"), set baseurl: "/website".
url: "https://USERNAME.github.io"   # TODO: replace USERNAME with your GitHub user name
baseurl: ""

# -------------------------------------------------------------
#  About you (used in the sidebar, home page, contact page, footer)
# -------------------------------------------------------------
author:
  name: Jonathan Naffrichoux
  short_name: J. Naffrichoux          # highlighted in author lists of publications
  position: PhD candidate in Mathematics
  field: Analysis of Stochastic PDEs
  avatar: /assets/img/avatar.svg      # replace with /assets/img/photo.jpg (square, ~400×400 px)
  email: jonathan.naffrichoux@univ-pau.fr   # TODO: check your exact address
  cv: ""                              # e.g. /assets/files/cv.pdf  (leave empty to hide the CV button)
  office: ""                          # e.g. "Office 123, Bâtiment IPRA"

lab:
  name: Laboratoire de Mathématiques et de leurs Applications de Pau
  short: LMAP
  umr: UMR CNRS 5142
  url: https://lma-umr5142.univ-pau.fr

university:
  name: Université de Pau et des Pays de l'Adour
  short: UPPA
  url: https://www.univ-pau.fr

address:
  - Laboratoire de Mathématiques et de leurs Applications de Pau
  - Université de Pau et des Pays de l'Adour
  - Bâtiment IPRA, Avenue de l'Université
  - 64013 Pau Cedex, France

supervisors:
  - name: Charles-Edouard Bréhier
    affiliation: LMAP, Université de Pau et des Pays de l'Adour
    url: ""                           # optional personal page
  - name: Ludovic Goudenège
    affiliation: LaMME, Université d'Évry Paris-Saclay
    url: ""

# -------------------------------------------------------------
#  Build settings (no need to touch)
# -------------------------------------------------------------
markdown: kramdown
kramdown:
  input: GFM
  math_engine: mathjax   # kramdown only wraps $$…$$; KaTeX renders it in the browser

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

defaults:
  - scope:
      path: ""
    values:
      layout: page

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - .github
