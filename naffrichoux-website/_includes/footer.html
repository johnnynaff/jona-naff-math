{% comment %} Footer at the bottom of the content column. {% endcomment %}
<footer class="footer">
  <p>
    © {{ site.time | date: "%Y" }} {{ site.author.name }} ·
    <a href="{{ site.lab.url }}">{{ site.lab.short }}</a>,
    <a href="{{ site.university.url }}">{{ site.university.name }}</a>
  </p>
  <p class="footer__meta">Last updated {{ site.time | date: "%-d %B %Y" }}</p>
</footer>
