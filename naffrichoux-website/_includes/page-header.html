{% comment %} Title block at the top of every inner page (front matter: kicker, title, description). {% endcomment %}
<header class="page-header">
  {% if page.kicker %}<p class="kicker">{{ page.kicker }}</p>{% endif %}
  <h1 class="page-title">{{ page.title }}</h1>
  {% if page.description %}<p class="page-lead">{{ page.description }}</p>{% endif %}
</header>
