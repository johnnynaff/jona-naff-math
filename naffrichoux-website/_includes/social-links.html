{% comment %} Small icon row of profile links. Entries with an empty url are skipped. {% endcomment %}
<ul class="social" aria-label="Profiles">
  <li>
    <a class="social__link" href="mailto:{{ site.author.email }}" title="Email" aria-label="Email">
      {% include icon.html name="mail" %}
    </a>
  </li>
  {% for link in site.data.social %}
    {% if link.url and link.url != "" %}
      <li>
        <a class="social__link" href="{{ link.url }}" title="{{ link.title }}" aria-label="{{ link.title }}" rel="me noopener">
          {% include icon.html name=link.icon %}
        </a>
      </li>
    {% endif %}
  {% endfor %}
</ul>
