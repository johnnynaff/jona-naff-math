{% comment %} Light/dark switch. Logic in assets/js/theme.js. {% endcomment %}
<button class="theme-toggle" type="button" data-theme-toggle aria-label="Switch colour theme">
  <span class="theme-toggle__icon theme-toggle__icon--sun">{% include icon.html name="sun" %}</span>
  <span class="theme-toggle__icon theme-toggle__icon--moon">{% include icon.html name="moon" %}</span>
  <span class="theme-toggle__label" data-theme-label>Dark mode</span>
</button>
